[project]
name = "datum"
version = "0.0.1"
description = "Datum: a governed record of company data, with intake, tickets and role views over MCP."
requires-python = ">=3.11"
dependencies = [
    # Excel reader and writer, pinned (build-plan G7, owner answer Q3): staging reads in
    # read-only mode, and the synthetic stock export is written with it.
    "openpyxl==3.1.5",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
