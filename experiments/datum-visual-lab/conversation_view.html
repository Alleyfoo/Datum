<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Datum conversation task</title>
<style>
:root{font:14px/1.45 system-ui,sans-serif;color:#1e3637;background:#f7faf8}*{box-sizing:border-box}body{margin:0;padding:12px}.card{max-width:720px;margin:auto;border:1px solid #b8d3c8;border-radius:12px;background:white;padding:16px}header{display:flex;gap:10px;justify-content:space-between;align-items:center}h1{font-size:17px;margin:0}.tag{font-size:12px;color:#285c4f}.summary{margin:8px 0}.muted{font-size:12px;color:#536a65}.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:end}label{display:grid;gap:3px;font-size:12px}label.check{display:flex;align-items:center}select,button{font:inherit;border-radius:6px;padding:6px 9px;border:1px solid #9eb9af;background:white;color:#1e3637}button{cursor:pointer}button.primary{background:#17634d;color:white;border-color:#17634d}button:disabled,select:disabled{opacity:.5;cursor:not-allowed}details{margin-top:10px;border-top:1px solid #e4eeea;padding-top:6px}p{margin:5px 0}ul{margin:5px 0;padding-left:20px}.feedback{font-size:12px;min-height:1.3em;color:#315d4f}.warn{color:#994f18}.tools{margin-top:8px}.small{font-size:11px;color:#58716b}:focus-visible{outline:3px solid #b77b12;outline-offset:2px}
</style></head><body><main class="card"><header><h1 id="title">Waiting for task</h1><span id="revision" class="tag"></span></header><p class="summary" id="summary"></p><p class="muted" id="scope"></p><p class="muted" id="uncertainty"></p><div class="controls"><label>Scenario<select id="scenario"><option value="baseline">Baseline</option><option value="delivery">Hypothetical delivery</option></select></label><label class="check"><input type="checkbox" id="substitutes">Consider substitute evidence</label><button class="primary" id="evaluate" disabled>Evaluate</button><button id="refresh" disabled>Refresh</button></div><details id="details"><summary>Inspect evidence</summary><div id="evidence"></div><label>Selected record<select id="selected"></select></label><p class="small">Selection is local to this view until you share context.</p></details><div class="controls tools"><button id="context" disabled>Share context</button><button id="ask" disabled>Ask agent why</button><button id="mode" disabled>Fullscreen</button></div><p class="small" id="capability"></p><p class="feedback" id="feedback" role="status" aria-live="polite">Waiting for the host tool result.</p><p class="small">Synthetic data. A review is not verified authorization. No ERP action.</p></main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), send=x=>window.parent.postMessage(x,'*');
let task=null,caps={},hostContext={},initialized=false,dirty=false,pending=new Map(),nextId=4001,closed=false;
window.datumCommunication=[];
function log(kind,details={}){window.datumCommunication.push({kind,task_id:task?.task_id||null,revision:task?.revision??null,...details});if(window.datumCommunication.length>100)window.datumCommunication.shift()}
function req(method,params){return new Promise((resolve,reject)=>{if(closed){reject(Error('View closed'));return}let id=nextId++;pending.set(id,{resolve,reject,method});log('request',{method,id});send({jsonrpc:'2.0',id,method,params});setTimeout(()=>{if(pending.has(id)){pending.delete(id);log('timeout',{method});reject(Error('Host request timed out'))}},15000)})}
function feedback(text,warning=false){$('feedback').textContent=text;$('feedback').classList.toggle('warn',warning)}
function enabled(){const tools=initialized&&!!caps.serverTools&&!!task;const repair=task?.task_type==='repair_investigation';$('refresh').disabled=!tools;$('evaluate').disabled=!tools||!repair;$('scenario').disabled=!tools||!repair;$('substitutes').disabled=!tools||!repair;$('context').disabled=!(initialized&&task&&caps.updateModelContext?.text);$('ask').disabled=!(initialized&&task&&caps.message?.text);const modes=hostContext.availableDisplayModes||[];$('mode').disabled=!initialized||!modes.includes(hostContext.displayMode==='fullscreen'?'inline':'fullscreen');$('mode').textContent=hostContext.displayMode==='fullscreen'?'Inline':'Fullscreen';$('capability').textContent=initialized&&!caps.message?.text?'Ask agent is unavailable: this host has not advertised conversation messages.':''}
function render(data,replaceForm=true){if(!data||typeof data.task_id!=='string'||!Number.isInteger(data.revision)||!data.parameters)throw Error('Invalid task data');if(task&&task.task_id!==data.task_id)throw Error('Unexpected task identity');if(task&&data.revision<task.revision)throw Error('Older task result rejected');task=data;$('title').textContent=(data.parameters.machine_id||data.parameters.part_id||'Task')+' · '+(data.task_type==='repair_investigation'?'Parts investigation':'Supplier claims');$('revision').textContent='Revision '+data.revision;$('summary').textContent='Assessment: '+data.status+(data.parameters.strategy==='delivery'?' · hypothetical delivery':data.parameters.strategy?' · baseline':'');$('scope').textContent=data.scope;$('uncertainty').textContent=data.unknowns?.[0]||'No further uncertainty supplied.';if(replaceForm){$('scenario').value=data.parameters.strategy||'baseline';$('substitutes').checked=data.parameters.allow_substitutes===true;dirty=false}const previous=$('selected').value;$('selected').replaceChildren();let items=data.requirements?.length?data.requirements.map(r=>({id:r.part,label:r.part+' · '+r.source,detail:`${r.part_name}: required ${r.required}, available before allocation ${r.available_before}; ${r.source}`})):data.claims?.map(c=>({id:c.id,label:c.id+' · '+c.record_source,detail:`${c.claim} — ${c.source}; ${c.record_source}`}))||[];const evidence=$('evidence');evidence.replaceChildren();let list=document.createElement('ul');for(const row of items){let item=document.createElement('li');item.textContent=row.detail;list.append(item);$('selected').add(new Option(row.label,row.id))}if(!items.length)evidence.textContent='No source details supplied for this result.';else evidence.append(list);if(items.some(x=>x.id===previous))$('selected').value=previous;enabled();log('render')}
function refs(){return {task_id:task.task_id,revision:task.revision,evaluation_id:task.evaluation_id,receipt_id:task.receipt_id,selected_record:$('selected').value||null}}
async function callTool(name,args){const reply=await req('tools/call',{name,arguments:args});if(reply?.isError){log('tool_error',{tool:name});throw Error(reply.content?.find(x=>x.type==='text')?.text||'Tool rejected')};if(!reply?.structuredContent)throw Error('Tool returned no structured data');return reply.structuredContent}
async function refresh(reason){if(!task||!caps.serverTools)return;if(dirty&&reason==='active'){feedback('Task may have changed; your draft is preserved. Use Refresh to discard it.',true);return}try{feedback('Refreshing…');const data=await callTool('datum_conversation_refresh',{task_id:task.task_id});render(data,true);feedback('Current task loaded.');log('refresh',{reason})}catch(e){feedback('Refresh failed: '+e.message,true)}}
$('scenario').onchange=$('substitutes').onchange=()=>{dirty=true;log('draft_changed');feedback('Unsaved parameters in this view.')};$('selected').onchange=()=>log('selection_changed');
$('refresh').onclick=()=>refresh('explicit');
$('evaluate').onclick=async()=>{if(!task)return;const params={task_id:task.task_id,strategy:$('scenario').value,allow_substitutes:$('substitutes').checked,expected_revision:task.revision};try{feedback('Evaluating…');const data=await callTool('datum_conversation_evaluate',params);render(data,true);feedback('Evaluation saved. No model turn was requested.')}catch(e){feedback('Evaluation failed: '+e.message,true)}};
$('context').onclick=async()=>{try{const r=refs();const ack=await req('ui/update-model-context',{content:[{type:'text',text:JSON.stringify(r)}]});if(ack?.isError)throw Error('Host declined the context update');feedback('Host acknowledged context update; model delivery is not confirmed.');log('context_ack')}catch(e){feedback('Context update failed: '+e.message,true)}};
$('ask').onclick=async()=>{try{const r=refs();const text=`Please explain why the result changed for task ${r.task_id}, shown revision ${r.revision}, evaluation ${r.evaluation_id}, receipt ${r.receipt_id}, selected record ${r.selected_record}. Retrieve authoritative current state through MCP. Distinguish hypothetical data, stock readiness, unknowns and unverified review labels.`;const result=await req('ui/message',{role:'user',content:[{type:'text',text}]});if(result?.isError)throw Error('Host declined the message');feedback('Host acknowledged the message; an agent response is not confirmed.');log('message_ack')}catch(e){feedback('Message failed: '+e.message,true)}};
$('mode').onclick=async()=>{try{let mode=hostContext.displayMode==='fullscreen'?'inline':'fullscreen';let r=await req('ui/request-display-mode',{mode});hostContext.displayMode=r.mode;enabled();log('display_mode',{mode:r.mode})}catch(e){feedback('Display mode failed: '+e.message,true)}};
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refresh('active')});
window.addEventListener('message',e=>{if(e.source!==window.parent||e.data?.jsonrpc!=='2.0')return;const m=e.data;if(m.id===4000){if(!m.result?.protocolVersion){feedback('Host initialization failed.',true);return}initialized=true;caps=m.result.hostCapabilities||{};hostContext=m.result.hostContext||{};send({jsonrpc:'2.0',method:'ui/notifications/initialized',params:{}});enabled();log('initialized');return}if(m.method==='ui/resource-teardown'&&m.id!==undefined){closed=true;send({jsonrpc:'2.0',id:m.id,result:{}});for(const p of pending.values())p.reject(Error('View closed'));pending.clear();log('teardown');return}if(!initialized)return;if(m.method==='ui/notifications/host-context-changed'){hostContext={...hostContext,...m.params};enabled();log('host_context_changed');return}if(m.method==='ui/notifications/tool-result'){try{if(m.params?.isError)throw Error('Opening tool failed');const incoming=m.params?.structuredContent;if(task&&incoming?.task_id!==task.task_id)throw Error('Unexpected task identity');if(task&&dirty){log('incoming_deferred');feedback('A result arrived while your draft is unsaved. Refresh to discard it.',true);return}render(incoming);feedback('Task loaded. Context is not sent automatically.')}catch(err){feedback('Cannot load task: '+err.message,true)}return}if(m.id!==undefined&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);if(m.error){log('error',{method:p.method});p.reject(Error(m.error.message||'Host rejected request'))}else{log('ack',{method:p.method});p.resolve(m.result||{})}}});
if(window.parent===window){feedback('Open this view in an MCP Apps host.',true);return}send({jsonrpc:'2.0',id:4000,method:'ui/initialize',params:{appInfo:{name:'Datum Conversation Experiment',version:'0.1.0'},appCapabilities:{availableDisplayModes:['inline','fullscreen']},protocolVersion:'2026-01-26'}});
})();
</script></body></html>
