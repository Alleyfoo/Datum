<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Datum task interface</title>
<style>
:root{font:15px/1.5 system-ui,sans-serif;background:#eef3f2;color:#1a3138}*{box-sizing:border-box}body{margin:0;padding:22px}main{max-width:1100px;margin:auto}header,.card{background:white;border:1px solid #c8d9d5;border-radius:12px;padding:20px;margin-bottom:14px}h1{margin:.2em 0;font-size:clamp(1.5rem,3vw,2.2rem)}h2{font-size:1.1rem;margin:0 0 12px}.eyebrow{font-size:.75rem;letter-spacing:.12em;color:#206d58;font-weight:700;text-transform:uppercase}.meta{color:#536b6e}.status{padding:10px;background:#e9f4ef;border-radius:7px}form{display:flex;flex-wrap:wrap;gap:12px;align-items:end}label.field{display:grid;gap:4px;min-width:180px;flex:1}select,input,textarea{width:100%;border:1px solid #a6beba;border-radius:6px;padding:8px;background:white;color:inherit;font:inherit}input[type=checkbox]{width:auto}.check{display:flex!important;align-items:center;gap:8px!important;min-width:180px}button{font:inherit;color:white;background:#17644f;border:1px solid #17644f;border-radius:6px;padding:8px 14px;cursor:pointer}button:disabled{background:#dbe4e1;color:#63746f;border-color:#c9d6d2;cursor:not-allowed}:focus-visible{outline:3px solid #d29428;outline-offset:2px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.item{background:#f2f7f5;border-left:3px solid #6fae98;padding:10px;overflow-wrap:anywhere}.item b{display:block;font-size:.75rem;letter-spacing:.03em;color:#45645e}.tablewrap{overflow:auto;max-height:300px}table{border-collapse:collapse;min-width:100%;font-size:.91rem}th,td{text-align:left;vertical-align:top;border-bottom:1px solid #d9e6e2;padding:8px;overflow-wrap:anywhere}svg{width:100%;height:auto;min-height:140px;background:#f4f9f7;border:1px solid #d5e5df;border-radius:8px}.node{cursor:pointer}.node rect{fill:#e3f1eb;stroke:#57987d}.node text{font-size:12px;fill:#193a32}.edge{stroke:#83a79a;stroke-width:1.5}.graphdetail{margin-top:8px;color:#47625c}.note{color:#5a6b68;font-size:.9rem}ul{padding-left:1.3em}footer{font-size:.8rem;color:#5c716b;padding:5px 0 20px}@media(max-width:520px){body{padding:10px}header,.card{padding:14px}form{display:grid}label.field{min-width:0}}
</style></head><body><main><header><div class="eyebrow">Datum · persistent task experiment</div><h1 id="title">Waiting for task interface</h1><div id="taskMeta" class="meta"></div><p id="connection" class="status" role="status" aria-live="polite">Waiting for a host tool result…</p></header><div id="components"></div><footer>Synthetic records. Human review is a local record, not authorization or ERP action.</footer></main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), NS='http://www.w3.org/2000/svg';
const allowedTools=new Set(['datum_task_ui_evaluate','datum_task_ui_review']);
let initialized=false,canCall=false,pending=null,nextId=1301,current=null;
const message=(method,params,id)=>{const payload={jsonrpc:'2.0',method,params};if(id!==undefined)payload.id=id;window.parent.postMessage(payload,'*')};
const element=(tag,text)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=String(text??'');return e};
const textValue=v=>v==null?'Unknown':typeof v==='object'?JSON.stringify(v):String(v);
function call(tool,args){if(!initialized||!canCall||pending)return;if(!allowedTools.has(tool)){ $('connection').textContent='Unsupported tool in interface description.';return }pending=nextId++;$('connection').textContent='Requesting a server update…';document.querySelectorAll('form button').forEach(b=>b.disabled=true);message('tools/call',{name:tool,arguments:args},pending)}
function renderForm(data,card){if(!Array.isArray(data.fields)||!data.action||!allowedTools.has(data.action.tool))throw Error('Invalid form definition');const form=element('form');const fields=[],enabled=canCall&&data.action.enabled!==false;
 for(const field of data.fields){if(!field||typeof field.name!=='string'||field.name==='task_id'||!['select','checkbox','text','textarea'].includes(field.type))throw Error('Unsupported form field');const label=element('label');label.className='field';let input;
  if(field.type==='select'){input=element('select');if(!Array.isArray(field.options))throw Error('Invalid field options');for(const option of field.options){const opt=element('option',option.label);opt.value=String(option.value);input.append(opt)}input.value=String(field.value??'')}
  else{input=element(field.type==='textarea'?'textarea':'input');if(field.type!=='textarea')input.type=field.type;if(field.type==='checkbox'){input.checked=field.value===true;label.classList.add('check')}else input.value=String(field.value??'')}
  input.name=field.name;input.required=field.required===true;input.disabled=!enabled;label.append(element('span',field.label||field.name),input);form.append(label);fields.push({field,input}) }
 const submit=element('button',data.action.label||'Submit');submit.type='submit';submit.disabled=!enabled;form.append(submit);form.addEventListener('submit',e=>{e.preventDefault();if(!enabled)return;const values={...(data.action.arguments||{})};for(const {field,input} of fields)values[field.name]=field.type==='checkbox'?input.checked:input.value;call(data.action.tool,values)});card.append(form);if(data.action.enabled===false&&data.action.disabled_reason){const note=element('p',data.action.disabled_reason);note.className='note';card.append(note)}}
function renderTable(data,card){if(!Array.isArray(data.columns)||!Array.isArray(data.rows))throw Error('Invalid table');const wrap=element('div');wrap.className='tablewrap';const table=element('table'),thead=element('thead'),header=element('tr'),tbody=element('tbody');for(const col of data.columns){const th=element('th',col.label);th.scope='col';header.append(th)}thead.append(header);for(const row of data.rows){const tr=element('tr');for(const col of data.columns)tr.append(element('td',textValue(row[col.key])));tbody.append(tr)}table.append(thead,tbody);wrap.append(table);card.append(wrap);if(!data.rows.length)card.append(element('p','No records available.'))}
function renderItems(data,card){if(!Array.isArray(data.items))throw Error('Invalid items');const grid=element('div');grid.className='grid';for(const item of data.items){const cell=element('div');cell.className='item';cell.append(element('b',item.label),element('span',textValue(item.value)));grid.append(cell)}card.append(grid);if(Array.isArray(data.notes)&&data.notes.length){const ul=element('ul');for(const note of data.notes)ul.append(element('li',textValue(note)));card.append(ul)}}
function renderGraph(data,card){if(!Array.isArray(data.nodes)||!Array.isArray(data.edges))throw Error('Invalid graph');const svg=document.createElementNS(NS,'svg');svg.setAttribute('viewBox',`0 0 800 ${Math.max(160, Math.ceil(data.nodes.length/3)*100+20)}`);svg.setAttribute('role','group');svg.setAttribute('aria-label','Evidence graph; select a node for details');const nodes=new Map();data.nodes.forEach((n,i)=>{if(typeof n.id!=='string')throw Error('Invalid graph node');nodes.set(n.id,{...n,x:135+(i%3)*265,y:55+Math.floor(i/3)*100})});for(const edge of data.edges){const a=nodes.get(edge.from),b=nodes.get(edge.to);if(!a||!b)throw Error('Graph edge has unknown node');const line=document.createElementNS(NS,'line');line.setAttribute('x1',a.x);line.setAttribute('y1',a.y);line.setAttribute('x2',b.x);line.setAttribute('y2',b.y);line.setAttribute('class','edge');svg.append(line)}const detail=element('p','Select a node to inspect its source detail.');detail.className='graphdetail';for(const n of nodes.values()){const g=document.createElementNS(NS,'g'),rect=document.createElementNS(NS,'rect'),t=document.createElementNS(NS,'text');g.setAttribute('class','node');g.setAttribute('role','button');g.setAttribute('tabindex','0');g.setAttribute('aria-label',`Inspect ${n.label}`);g.dataset.node=n.id;rect.setAttribute('x',n.x-110);rect.setAttribute('y',n.y-22);rect.setAttribute('width','220');rect.setAttribute('height','44');rect.setAttribute('rx','6');t.setAttribute('x',n.x);t.setAttribute('y',n.y+4);t.setAttribute('text-anchor','middle');t.textContent=String(n.label).slice(0,30);const select=()=>{detail.textContent=`${n.label}: ${textValue(n.detail)}`};g.addEventListener('click',select);g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select()}});g.append(rect,t);svg.append(g)}card.append(svg,detail)}
const renderers={parameter_form:renderForm,data_table:renderTable,evidence_graph:renderGraph,status_summary:renderItems,decision_receipt:renderItems};
function render(data){if(!data||typeof data.task_id!=='string'||!Array.isArray(data.components)||!data.data||typeof data.data!=='object')throw Error('Invalid interface description');const container=$('components');container.replaceChildren();$('title').textContent=data.title||'Task';$('taskMeta').textContent=`Task ${data.task_id} · ${data.task_type||'unknown type'}`;for(const c of data.components){if(!Object.hasOwn(renderers,c.type)||typeof c.source!=='string'||!Object.hasOwn(data.data,c.source))throw Error('Unsupported component or data source');const card=element('section');card.className='card';card.dataset.component=c.type;card.dataset.source=c.source;card.append(element('h2',c.title||c.type));renderers[c.type](data.data[c.source],card);container.append(card)}current=data;$('connection').textContent=canCall?'Task loaded. Changes require an explicit action.':'Task loaded, but this host does not advertise tool calls.';requestAnimationFrame(()=>message('ui/notifications/size-changed',{height:Math.min(6000,Math.ceil(document.documentElement.scrollHeight))}))}
function consume(result){if(result?.isError)throw Error(result.content?.find(c=>c.type==='text')?.text||'Server rejected the operation');render(result?.structuredContent)}
window.addEventListener('message',event=>{if(event.source!==window.parent||event.data?.jsonrpc!=='2.0')return;const msg=event.data;if(msg.id===1300){if(!msg.result?.protocolVersion){$('connection').textContent='Host initialization failed.';return}initialized=true;canCall=!!msg.result.hostCapabilities&&Object.hasOwn(msg.result.hostCapabilities,'serverTools');message('ui/notifications/initialized',{});return}if(msg.method==='ui/resource-teardown'&&msg.id!==undefined){window.parent.postMessage({jsonrpc:'2.0',id:msg.id,result:{}},'*');return}if(!initialized)return;if(msg.method==='ui/notifications/tool-result'&&!pending){try{consume(msg.params)}catch(e){$('components').replaceChildren();$('connection').textContent=`Unable to load task: ${e.message}`}return}if(msg.id===pending){pending=null;try{if(msg.error)throw Error(msg.error.message||'Host rejected request');consume(msg.result)}catch(e){$('connection').textContent=`Request failed: ${e.message}`;if(current){try{render(current);$('connection').textContent=`Request failed: ${e.message}`}catch(_){}}}}});
if(window.parent===window){$('connection').textContent='Open this task through an MCP Apps host.';return}message('ui/initialize',{appInfo:{name:'Datum Task Interface',version:'0.1.0'},appCapabilities:{},protocolVersion:'2026-01-26'},1300);
})();
</script></body></html>
